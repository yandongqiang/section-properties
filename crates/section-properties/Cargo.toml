[package]
name = "section-properties"
version = "0.4.0"
authors = ["yandongqiang <yandongqiang@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Structural cross-section properties: geometric/principal moments, section moduli, warping/torsion FEM, plastic, cold-formed, and fire analysis."
license = "MIT"
repository = "https://github.com/yandongqiang/section-properties"
homepage = "https://github.com/yandongqiang/section-properties"
documentation = "https://docs.rs/section-properties"
readme = "README.md"
keywords = ["structural", "section", "properties", "fem", "civil-engineering"]
categories = ["science", "mathematics"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
thiserror = "1.0"
