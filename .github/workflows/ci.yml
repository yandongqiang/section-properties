name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  RUST_MIN_STACK: "2147483648"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  test:
    name: Test (debug, fast subset)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Doctests
        run: cargo test --doc
      - name: Fast integration tests
        run: >
          cargo test
          --test analytical_benchmark
          --test api_misuse
          --test beam_fem
          --test beam_fem_robustness
          --test beam_fem_convergence
          --test beam_fem_numerical_audit
          --test beam_fem_reference
          --test beam_multisolver_cross_validation
          --test beam_solver_backends
          --test boolean_regression
          --test cross_validation
          --test frame_api
          --test frame_correctness
          --test frame_beam_integration
          --test frame_beam_p2_convergence
          --test frame_transformation_contract
          --test mechanism_diagnostics
          --test numerical_validation
          --test solver_selection
          --test solver_robustness
          --test solver_architecture_correctness
          --test sparse_lu

  release:
    name: Release build + full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Full release tests (skip known-failing mesh test)
        run: cargo test --release --all -- --skip warping_domain_regression

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features
        continue-on-error: true

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
        continue-on-error: true
