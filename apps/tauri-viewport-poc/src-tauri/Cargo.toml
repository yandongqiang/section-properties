[package]
name = "tauri-viewport-poc"
version = "0.1.0"
edition = "2024"

[lib]
name = "tauri_viewport_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
structural-analysis = { path = "../../../crates/structural-analysis" }

[dev-dependencies]
structural-analysis = { path = "../../../crates/structural-analysis" }
serde_json = "1"
